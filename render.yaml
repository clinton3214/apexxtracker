services:
  - type: web
    name: cadence-app
    env: node
    plan: free
    buildCommand: npm install && cd client && npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cadence-db
          property: connectionString

databases:
  - name: cadence-db
    databaseName: cadence
    user: cadence_user
